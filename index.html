.srow .sl b{font-size:14px;display:block}.srow .sl b em{font-style:normal;color:var(--ac);margin-left:8px;font-weight:700}
.srow .sl small{display:block;color:var(--mut);font-size:12px;line-height:1.3;margin-top:2px}
.srow input[type=text]{width:130px;padding:7px 9px;border-radius:8px;border:1px solid var(--bar);background:var(--bg);color:var(--fg);font:inherit;box-sizing:border-box}
.srow select{padding:7px 8px;border-radius:8px;border:1px solid var(--bar);background:var(--bg);color:var(--fg);font:inherit;flex:none}
.srow input[type=range]{width:100%;margin:0;accent-color:var(--ac)}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--bar);border-radius:13px;transition:.2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0005;transition:.2s}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i::after{transform:translateX(20px)}
.sbody{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.stat .pb{height:8px}.stat .pb i{transition:width .4s}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{background:var(--pn);color:var(--fg);border:2px solid var(--ac);border-radius:14px;padding:14px;width:158px;cursor:pointer;font:inherit;text-align:left;animation:popIn .45s both;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 10px 24px #0006}
.card b{display:block;margin-bottom:4px;font-size:15px}
button.go,button.go2{border-radius:12px;padding:12px 22px;font:700 16px system-ui;cursor:pointer;transition:transform .12s,filter .12s}
button.go{background:linear-gradient(135deg,#f0714f,#e8573d);color:#fff;border:0;box-shadow:0 4px 12px #e8573d66}
button.go:hover,button.go2:hover{transform:translateY(-2px);filter:brightness(1.08)}
button.go:active,button.go2:active{transform:scale(.97)}
button.go2{background:transparent;color:inherit;border:2px solid currentColor}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.pb{height:10px;border-radius:5px;background:var(--bar);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#f0714f,#ffb15a)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 4px;text-align:left}tr+tr{border-top:1px solid var(--bar)}
label{display:block;font-size:14px}

const LL={

const llOn=()=>!!(LL.gameKey&&LL.leaderboard&&typeof fetch==='function');
if(!SAVE.uid)SAVE.uid='bm-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
async function llReq(method,path,body,auth){
 const h={'Content-Type':'application/json'};if(auth)h['x-session-token']=LL.token;
 let r;try{r=await fetch(LL.api+path,{method,headers:h,body:body?JSON.stringify(body):undefined})}catch(e){console.error('LootLocker',e);throw new Error('réseau bloqué')}
 if(!r.ok){if(r.status===401||r.status===403)LL.token=null;let tx='';try{tx=(await r.text()).slice(0,120)}catch(e){}console.error('LootLocker',r.status,tx);throw new Error('HTTP '+r.status+(tx?' '+tx:''))}
 return r.json()}
function llSession(){
 if(LL.token)return Promise.resolve();
 if(!LL.sessP)LL.sessP=llReq('POST','/game/v2/session/guest',{game_key:LL.gameKey,game_version:LL.version,development_mode:LL.dev,player_identifier:SAVE.uid}).then(d=>{LL.token=d.session_token;LL.pid=d.player_id;LL.sessP=null}).catch(e=>{LL.sessP=null;throw e});
 return LL.sessP}
async function llSubmit(score,meta){
 await llSession();
 try{await llReq('PATCH','/game/player/name',{name:SAVE.name},true)}catch(e){}
 return llReq('POST','/game/leaderboards/'+encodeURIComponent(LL.leaderboard)+'/submit',{member_id:String(LL.pid),score:Math.round(score),metadata:meta||''},true)}
async function llTop(n){/* n entrées */
 await llSession();
 const d=await llReq('GET','/game/leaderboards/'+encodeURIComponent(LL.leaderboard)+'/list?count='+(n||10),null,true);
 return d.items||[]}

function acInit(){if(AC)return true;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AC=new C();const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=6;cp.connect(AC.destination);SFXG=AC.createGain();MUSG=AC.createGain();SFXG.connect(cp);MUSG.connect(cp);NBUF=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NBUF.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;applyAudio();musNext=0;musTimer=setInterval(musTick,60);return true}catch(e){AC=null;return false}}

function tone(f0,f1,d,type,v,dl,lp,dest){const T=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,T);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),T+d);g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+.006);g.gain.exponentialRampToValueAtTime(.0001,T+d);let n=o;if(lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f}n.connect(g);g.connect(dest||SFXG);o.start(T);o.stop(T+d+.03)}
function nz(d,v,ft,f0,f1,dl,dest){const T=AC.currentTime+(dl||0),sr=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();sr.buffer=NBUF;sr.loop=true;f.type=ft||'lowpass';f.frequency.setValueAtTime(f0,T);if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),T+d);g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+.004);g.gain.exponentialRampToValueAtTime(.0001,T+d);sr.connect(f);f.connect(g);g.connect(dest||SFXG);sr.start(T);sr.stop(T+d+.03)}

function musNote(T,sn,dl,sl){const bar=(sn>>4)&3,k=sn&15,rt=T.root+T.prog[bar],iv=T.q[bar]?[0,4,7]:[0,3,7],ch=iv.map(x=>rt+x);
if(T.pad&&k===0)for(const n of ch)tone(mtof(n),mtof(n),sl*15,'triangle',.07,dl,900,MUSG);
if(T.bp.includes(k))tone(mtof(ch[0]-24),mtof(ch[0]-24)*.98,sl*2.6,'triangle',.3,dl,650,MUSG);
if(T.arp&&k%2===0){const a=[0,1,2,1,0,2,1,2][k>>1],n=ch[a]+(k>7?24:12);tone(mtof(n),mtof(n),sl*1.7,'square',.045,dl,1800,MUSG)}
if(T.hat===1&&k%4===2||T.hat===2&&k%2===1)nz(.04,.07,'highpass',7000,0,dl,MUSG);
if(T.kick&&k%T.kick===0)tone(135,42,.15,'sine',.4,dl,0,MUSG);
if(T.lead&&bar>=2&&k%2===0&&Math.random()<T.lead*.45){const n=T.root+12+T.sc[Math.random()*T.sc.length|0]+(Math.random()<.3?12:0);tone(mtof(n),mtof(n),sl*3,'triangle',.07,dl,2500,MUSG)}}

noctyra:{n:'Lune noire',e:'🌙',d1:'Trois lames d’ombre en éventail qui ralentissent les ennemis',du:'Lames plus longues et plus fortes · dès le niv. 5 : 5 lames',f(l,c){const{pp,tick,wd}=c;if(!tick('s_no',Math.max(1.3,2.4-.11*l)))return;const d=aimDir(pp),b0=Math.atan2(d.x,d.z),k=l>=5?2:1,len=13+.6*l;for(let j=-k;j<=k;j++){const a=b0+j*.3,dx=Math.sin(a),dz=Math.cos(a);rayFx({x:pp.x,y:1,z:pp.z},{x:pp.x+dx*len,y:1,z:pp.z+dz*len},0x9a6aff,.3);segHit(pp.x,pp.z,dx,dz,len,1,e=>{wd(e,st.dmg*(1.4+.3*l),0x9a6aff,.08);if(!e.boss)e.slow=Math.max(e.slow,1.2)})}}},

glacin:{n:'Grêle',e:'🧊',d1:'Des grêlons s’abattent autour de toi et ralentissent les ennemis',du:'Plus de grêlons, plus de dégâts',f(l,c){const{pp,xs,AR,tick,wd}=c;if(!tick('s2_gl',Math.max(1.2,2.2-.1*l)))return;const n=5+l+2*xs,R=12+.5*l;for(let i=0;i<n;i++)later(i*.05,()=>{const tg=Math.random()<.6?rndE(R,pp):null,x=tg?tg.m.position.x+rnd(-1,1):pp.x+rnd(-R,R),z=tg?tg.m.position.z+rnd(-1,1):pp.z+rnd(-R,R),r=1.6*Math.sqrt(AR);rayFx({x:x+.5,y:12,z:z+.5},{x,y:0,z},0xcff4ff,.25);ringAt(x,z,0xbff0ff,r,.25);for(const e of E)if(e.hp>0&&Math.hypot(e.m.position.x-x,e.m.position.z-z)<r+e.s){wd(e,st.dmg*(1+.2*l),0x9fe8ff,.06);if(!e.boss)e.slow=Math.max(e.slow,1.2)}})}},
